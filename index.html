<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zahid Risky Rabbani | Mechanical Design Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

</head>

<body>

    <!-- ================= HERO ================= -->

    <section class="hero">

        <h1>Zahid Risky Rabbani</h1>

        <p>Mechanical Design Portfolio</p>

    </section>

    <div class="section-divider"></div>

    <!-- ================= PROJECT ================= -->

    <section class="project">

        <span class="project-number">
            PROJECT 01
        </span>

        <h2>
            Centrifugal Pump
        </h2>

        <p class="project-category">
            Mechanical Design
        </p>


        <div class="viewer">

            <model-viewer

                src="assets/centrifugal-pump/model.glb"

                camera-controls

                auto-rotate

                shadow-intensity="1"

                exposure="1"

                interaction-prompt="none">

            </model-viewer>

        </div>

        <p class="viewer-info">
            Rotate • Zoom • Pan
        </p>



        <!-- Gallery -->

        <div class="gallery">

            <div class="gallery-item">

                <img
                    src="assets/centrifugal-pump/cover.png"
                    alt="Isometric View">

                <span>Isometric View</span>

            </div>

            <div class="gallery-item">

                <img
                    src="assets/centrifugal-pump/render1.png"
                    alt="Side View">

                <span>Side View</span>

            </div>

            <div class="gallery-item">

                <img
                    src="assets/centrifugal-pump/exploded.png"
                    alt="Exploded View">

                <span>Exploded View</span>

            </div>

        </div>

    </section>

    <div class="section-divider"></div>

    <section class="project">

        <span class="project-number">
            PROJECT 02
        </span>

        <h2>
            Cyclorotor
        </h2>

        <p class="project-category">
            Mechanical Design
        </p>


        <div class="viewer">

            <model-viewer

                src="assets/cyclorotor/model.glb"

                camera-controls

                auto-rotate

                shadow-intensity="1"

                exposure="1"

                interaction-prompt="none">

            </model-viewer>

        </div>

        <p class="viewer-info">
            Rotate • Zoom • Pan
        </p>

        <!-- Gallery -->

        <div class="gallery">

            <div class="gallery-item">

                <img
                    src="assets/cyclorotor/cover.png"
                    alt="Isometric View">

                <span>Isometric View</span>

            </div>

            <div class="gallery-item">

                <img
                    src="assets/cyclorotor/render1.png"
                    alt="Side View">

                <span>Side View</span>

            </div>

            <div class="gallery-item">

                <img
                    src="assets/cyclorotor/exploded.png"
                    alt="Exploded View">

                <span>Exploded View</span>

            </div>

        </div>

    </section>

    <div class="section-divider"></div>

    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 Zahid Risky Rabbani

    </footer>

    <!-- ================= LIGHTBOX ================= -->

    <div class="lightbox" id="lightbox">

        <span class="close">&times;</span>

        <img id="lightbox-img">

        <p id="lightbox-title"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
