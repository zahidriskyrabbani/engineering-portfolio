<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zahid Risky Rabbani | Mechanical Design Showcase</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Model Viewer -->
    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

</head>

<body>

    <!-- ===========================
            HERO
    ============================ -->

    <section class="hero">

        <h1>Zahid Risky Rabbani</h1>

        <p>
            Mechanical Design Showcase
        </p>

    </section>



    <!-- ===========================
            PROJECT
    ============================ -->

    <section class="project">

        <div class="viewer">

            <model-viewer

                src="assets/centrifugal-pump/model.glb"

                camera-controls

                auto-rotate

                shadow-intensity="1"

                exposure="1"

                interaction-prompt="auto">

            </model-viewer>

        </div>


        <div class="project-info">

            <span class="project-number">
                PROJECT 01
            </span>

            <h2>
                Centrifugal Pump
            </h2>

            <p>
                Mechanical Design
            </p>

            <a href="#gallery" class="button">

                View Gallery ↓

            </a>

        </div>

    </section>




    <!-- ===========================
            GALLERY
    ============================ -->

    <section class="gallery" id="gallery">

        <div class="gallery-item">

            <img
                src="assets/centrifugal-pump/render1.png"
                alt="Render 1">

            <h3>Render 1</h3>

        </div>



        <div class="gallery-item">

            <img
                src="assets/centrifugal-pump/render2.png"
                alt="Render 2">

            <h3>Render 2</h3>

        </div>



        <div class="gallery-item">

            <img
                src="assets/centrifugal-pump/exploded.png"
                alt="Exploded">

            <h3>Exploded View</h3>

        </div>

    </section>




    <!-- ===========================
            FOOTER
    ============================ -->

    <footer>

        © 2026

        Zahid Risky Rabbani

    </footer>



    <script src="script.js"></script>

</body>

</html>
